name: Backfill past seasons

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-read seasons that were already back-filled"
        type: boolean
        default: false

concurrency:
  group: ifa-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -q -r scraper/requirements.txt
      - name: Backfill
        env:
          IL_PROXY: ${{ secrets.IL_PROXY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m scraper.backfill ${{ inputs.force && '--force' || '' }}
