name: Keep scheduled sync alive

# GitHub pauses scheduled workflows in public repos after 60 days without activity.
# This makes a tiny empty commit once a month so the 10-minute sync never stops.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m)"
          git push
