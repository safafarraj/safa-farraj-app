name: Fetch club crest
on:
  workflow_dispatch:
    inputs:
      name:
        description: "file name in app/crests (without .png)"
        required: true
      url:
        description: "image URL (Wikipedia / Wikimedia only)"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          NAME: ${{ inputs.name }}
          URL: ${{ inputs.url }}
        run: |
          set -e
          [[ "$NAME" =~ ^[a-z0-9-]+$ ]] || { echo "bad name"; exit 1; }
          [[ "$URL" =~ ^https://(upload\.wikimedia\.org|thumb\.wikimedia\.org)/ ]] || { echo "only wikimedia"; exit 1; }
          curl -fsSL -A "safa-farraj-app/1.0 (crest fetch)" -o "app/crests/$NAME.png" "$URL"
          file "app/crests/$NAME.png" | grep -qi "image" || { echo "not an image"; exit 1; }
      - name: Commit
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "app/crests/$NAME.png"
          git commit -m "crest: $NAME" && git push
